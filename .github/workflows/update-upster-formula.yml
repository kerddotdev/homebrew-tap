name: Update Upster Formula

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (without v prefix)"
        required: true
      sha256_macos_arm64:
        description: "SHA256 of upster-macos-arm64.tar.gz"
        required: true
      sha256_macos_x64:
        description: "SHA256 of upster-macos-x64.tar.gz"
        required: true
      sha256_linux_arm64:
        description: "SHA256 of upster-linux-arm64.tar.gz"
        required: true
      sha256_linux_x64:
        description: "SHA256 of upster-linux-x64.tar.gz"
        required: true

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate formula
        env:
          VERSION: ${{ github.event.inputs.version }}
          MACOS_ARM64: ${{ github.event.inputs.sha256_macos_arm64 }}
          MACOS_X64: ${{ github.event.inputs.sha256_macos_x64 }}
          LINUX_ARM64: ${{ github.event.inputs.sha256_linux_arm64 }}
          LINUX_X64: ${{ github.event.inputs.sha256_linux_x64 }}
        run: |
          cat > Formula/upster.rb <<EOF
          class Upster < Formula
            desc "CLI client for the local Upster control plane"
            homepage "https://github.com/kerddotdev/upster"
            version "$VERSION"
            license "MIT"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/kerddotdev/upster/releases/download/v#{version}/upster-macos-arm64.tar.gz"
                sha256 "$MACOS_ARM64"
              else
                url "https://github.com/kerddotdev/upster/releases/download/v#{version}/upster-macos-x64.tar.gz"
                sha256 "$MACOS_X64"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "https://github.com/kerddotdev/upster/releases/download/v#{version}/upster-linux-arm64.tar.gz"
                sha256 "$LINUX_ARM64"
              else
                url "https://github.com/kerddotdev/upster/releases/download/v#{version}/upster-linux-x64.tar.gz"
                sha256 "$LINUX_X64"
              end
            end

            def install
              bin.install "upster"
            end

            def caveats
              <<~CAVEATS
                Upster CLI is a client for a local Upster control plane (dashboard + libSQL)
                that you run with Docker:

                  mkdir upster && cd upster
                  curl -LO https://github.com/kerddotdev/upster/releases/latest/download/docker-compose.yaml
                  curl -Lo .env https://github.com/kerddotdev/upster/releases/latest/download/env.example
                  # edit .env, then:
                  docker compose up -d
                  upster auth setup

                Docs: upster --help  |  https://github.com/kerddotdev/upster
              CAVEATS
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/upster --version")
            end
          end
          EOF

      - name: Commit and push
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/upster.rb
          git commit -m "Update upster to $VERSION"
          git push
