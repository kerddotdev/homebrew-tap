name: Update Formula

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (without v prefix)"
        required: true
      sha256_arm64:
        description: "SHA256 of wd-macos-arm64.tar.gz"
        required: true
      sha256_x64:
        description: "SHA256 of wd-macos-x64.tar.gz"
        required: true
      sha256_linux_arm64:
        description: "SHA256 of wd-linux-arm64.tar.gz"
        required: false
      sha256_linux_x64:
        description: "SHA256 of wd-linux-x64.tar.gz"
        required: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Update formula
        env:
          VERSION: ${{ github.event.inputs.version }}
          ARM64_SHA: ${{ github.event.inputs.sha256_arm64 }}
          X64_SHA: ${{ github.event.inputs.sha256_x64 }}
          LINUX_ARM64_SHA: ${{ github.event.inputs.sha256_linux_arm64 }}
          LINUX_X64_SHA: ${{ github.event.inputs.sha256_linux_x64 }}
        run: |
          awk -v release_version="$VERSION" \
            -v arm_sha="$ARM64_SHA" -v x64_sha="$X64_SHA" \
            -v linux_arm_sha="$LINUX_ARM64_SHA" -v linux_x64_sha="$LINUX_X64_SHA" '
            /^[[:space:]]*version "/ {
              sub(/version ".*"/, "version \"" release_version "\"")
            }
            /on_macos do/ { platform="macos" }
            /on_linux do/ { platform="linux" }
            /Hardware::CPU.arm\?/ { arch="arm64" }
            /^[[:space:]]*else$/ { arch="x64" }
            /^[[:space:]]*sha256 / {
              sha=""
              if (platform == "macos") {
                sha=(arch == "arm64" ? arm_sha : x64_sha)
              } else if (platform == "linux") {
                sha=(arch == "arm64" ? linux_arm_sha : linux_x64_sha)
              }
              if (sha != "") sub(/sha256 ".*"/, "sha256 \"" sha "\"")
            }
            { print }
          ' Formula/wd.rb > Formula/wd.rb.tmp && mv Formula/wd.rb.tmp Formula/wd.rb

      - name: Commit and push
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/wd.rb
          git commit -m "Update wd to $VERSION"
          git push
